[project]
name = "scansight-backend"
version = "1.0.0"
description = "Nmap-powered network scanner with CVE enrichment and AI explanations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S603",  # subprocess without shell: intentional, args are built from an allowlist
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]  # subprocess usage is reviewed: no shell, allowlisted args
