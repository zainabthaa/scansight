server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Docker's internal DNS. Resolving the backend per request (via a variable below) means a
    # rebuilt backend container with a new IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # API requests go to the FastAPI container.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Server-Sent Events: don't buffer, and allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # FastAPI's interactive API docs (Swagger UI loads its assets from a CDN, so this
    # location sets its own headers instead of the strict CSP above).
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Single-page app: send unknown paths to index.html.
    location / {
        try_files $uri /index.html;
    }
}
